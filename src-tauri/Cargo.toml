[package]
name = "nexus-vault"
version = "1.0.1"
description = "Local-first password manager and secure notes"
authors = ["Nexus Vault"]
edition = "2024"
publish = false

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nexus_vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
argon2 = "0.6.0"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
zeroize = { version = "1.9.1", features = ["derive", "std"] }
secrecy = { version = "0.10.3", features = ["serde"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
rand = "0.10.3"
uuid = { version = "1.29.0", features = ["v4"] }
getrandom = "0.4"
bip39 = { version = "3.0.0", default-features = false }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-notification = "2.8.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.2"
arboard = "3.7.0"
sha2 = "0.11.1"
# TOTP codes (RFC 6238) and the leaked-password check (HIBP works with SHA-1 hashes)
sha1 = "0.11"
hmac = "0.13"
# HTTPS for the leaked-password check; the same client and TLS stack the updater uses
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_RemoteDesktop", "Foundation", "Security_Credentials", "Security_Cryptography", "Storage_Streams"] }
tauri-plugin-updater = "2.14.1"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"

# Argon2id with 256 MiB is painfully slow unoptimized; keep `tauri dev` responsive.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.chacha20poly1305]
opt-level = 3

[profile.dev.package.chacha20]
opt-level = 3

[profile.dev.package.poly1305]
opt-level = 3
